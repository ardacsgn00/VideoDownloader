[package]
name = "video_indirici"
version = "1.0.0"
edition = "2024"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
